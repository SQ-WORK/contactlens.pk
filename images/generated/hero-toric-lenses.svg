    <circle cx="88" cy="585" r="3" fill="#1D9E75"/>
    <text x="100" y="590" font-family="Helvetica, Arial, sans-serif"
          font-size="14" font-weight="500" fill="#1a1a1a">WhatsApp prescription card for verification</text>


  <!-- Right side: eye illustration -->
  <g transform="translate(840, 315)">
    <path d="M -180,0 Q 0,-110 180,0 Q 0,110 -180,0 Z"
