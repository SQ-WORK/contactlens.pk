    <text x="80" y="450" font-family="Helvetica, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#5F5E5A">Starting from</text>
  <text x="80" y="495" font-family="Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" fill="#0F6E56">₨ 3,950</text>

  <!-- Feature bullets -->
    <circle cx="88" cy="555" r="3" fill="#1D9E75"/>
    <text x="100" y="560" font-family="Helvetica, Arial, sans-serif"
