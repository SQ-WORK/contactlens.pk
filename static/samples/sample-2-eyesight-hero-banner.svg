<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F4"/>
      <stop offset="100%" stop-color="#E1F5EE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b3a1f"/>
      <stop offset="50%" stop-color="#3d2511"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </radialGradient>
    <radialGradient id="lens-overlay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(29,158,117,0)"/>
      <stop offset="70%" stop-color="rgba(29,158,117,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,110,86,0.4)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative shapes -->
  <circle cx="1100" cy="100" r="180" fill="rgba(29,158,117,0.06)"/>
  <circle cx="80" cy="560" r="120" fill="rgba(29,158,117,0.05)"/>

  <!-- Left side: text content -->
  <text x="80" y="170" font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" letter-spacing="4"
        fill="#0F6E56">CONTACTLENS.PK</text>

  <text x="80" y="240" font-family="Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700"
        fill="#1a1a1a">Eye Lens for</text>
  <text x="80" y="305" font-family="Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700"
        fill="#1a1a1a">Weak Eyesight</text>

  <!-- Accent line -->
  <rect x="80" y="335" width="80" height="4" fill="url(#accent)"/>

  <text x="80" y="380" font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400"
        fill="#5F5E5A">Prescription contact lenses in Pakistan</text>

  <!-- Price callout -->
  <text x="80" y="450" font-family="Helvetica, Arial, sans-serif"
        font-size="18" font-weight="500"
        fill="#5F5E5A">Starting from</text>
  <text x="80" y="495" font-family="Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700"
        fill="#0F6E56">₨ 1,700</text>

  <!-- Feature bullets -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">
    <circle cx="88" cy="555" r="3" fill="#1D9E75"/>
    <text x="100" y="560">Acuvue · Bausch &amp; Lomb · Biomedics · Hoya</text>
    <circle cx="88" cy="585" r="3" fill="#1D9E75"/>
    <text x="100" y="590">Free delivery · Cash on delivery · WhatsApp +92 321 9455233</text>
  </g>

  <!-- Right side: stylized eye illustration -->
  <g transform="translate(840, 315)">
    <!-- Eye outer almond -->
    <path d="M -180,0 Q 0,-110 180,0 Q 0,110 -180,0 Z"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>

    <!-- Iris -->
    <circle cx="0" cy="0" r="90" fill="url(#iris)"/>

    <!-- Lens overlay (suggests a clear lens sitting on the eye) -->
    <circle cx="0" cy="0" r="100" fill="url(#lens-overlay)"/>

    <!-- Outer limbal ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="28" fill="#1a1a1a"/>

    <!-- Catchlights -->
    <ellipse cx="-22" cy="-22" rx="20" ry="14" fill="rgba(255,255,255,0.9)"/>
    <ellipse cx="18" cy="22" rx="8" ry="5" fill="rgba(255,255,255,0.5)"/>

    <!-- Subtle eyelash hint at top -->
    <path d="M -120,-40 Q -60,-65 0,-72 Q 60,-65 120,-40"
          fill="none" stroke="#1a1a1a" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Prescription card icon, top right -->
  <g transform="translate(1010, 80)" opacity="0.9">
    <rect x="-50" y="-30" width="100" height="60" rx="6"
          fill="#ffffff" stroke="#0F6E56" stroke-width="1.5"/>
    <line x1="-38" y1="-15" x2="20" y2="-15" stroke="#0F6E56" stroke-width="1.5"/>
    <line x1="-38" y1="-5"  x2="32" y2="-5"  stroke="#0F6E56" stroke-width="1.5"/>
    <line x1="-38" y1="5"   x2="14" y2="5"   stroke="#0F6E56" stroke-width="1.5"/>
    <line x1="-38" y1="15"  x2="28" y2="15"  stroke="#0F6E56" stroke-width="1.5"/>
    <text x="-50" y="-38" font-family="Helvetica, Arial, sans-serif" font-size="9"
          font-weight="600" fill="#0F6E56" letter-spacing="1">RX PRESCRIPTION</text>
  </g>
</svg>
