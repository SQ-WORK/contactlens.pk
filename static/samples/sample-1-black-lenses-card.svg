<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="60%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="highlight" cx="35%" cy="35%" r="20%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)"/>

  <!-- Subtle pattern overlay -->
  <circle cx="60" cy="80" r="1.5" fill="rgba(255,255,255,0.05)"/>
  <circle cx="340" cy="120" r="1" fill="rgba(255,255,255,0.05)"/>
  <circle cx="100" cy="320" r="1.5" fill="rgba(255,255,255,0.05)"/>
  <circle cx="320" cy="290" r="1" fill="rgba(255,255,255,0.05)"/>

  <!-- Eye outer shape (almond) -->
  <path d="M 100,200 Q 200,130 300,200 Q 200,270 100,200 Z"
        fill="#f8f6f0" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Iris (the black lens) -->
  <circle cx="200" cy="200" r="55" fill="url(#iris-grad)"/>

  <!-- Subtle limbal ring -->
  <circle cx="200" cy="200" r="55" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Pupil -->
  <circle cx="200" cy="200" r="14" fill="#000"/>

  <!-- Highlight (catchlight) -->
  <ellipse cx="184" cy="184" rx="14" ry="10" fill="rgba(255,255,255,0.85)"/>
  <ellipse cx="216" cy="215" rx="5" ry="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Bottom text band -->
  <rect x="0" y="320" width="400" height="80" fill="rgba(0,0,0,0.6)"/>

  <!-- "BLACK" label -->
  <text x="200" y="360" font-family="Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="3"
        fill="#ffffff" text-anchor="middle">BLACK</text>
  <text x="200" y="385" font-family="Helvetica, Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="4"
        fill="rgba(255,255,255,0.7)" text-anchor="middle">CONTACT LENSES</text>
</svg>
